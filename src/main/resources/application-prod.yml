spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}

wordlist:
  llm:
    provider: ${LLM_PROVIDER:none}
    model: ${LLM_MODEL}
    base-url: ${LLM_BASE_URL}
    api-key: ${LLM_API_KEY}
  async:
    compensate-enabled: ${COMPENSATE_ENABLED:false}
